<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FITSTACK — Admin Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body class="admin-login-page"><div class="login-background"></div><main class="login-shell"><div class="login-brand"><a class="brand" href="/"><span class="brand-mark">✦</span> FITSTACK</a></div><section class="login-card"><span class="eyebrow">SECURE ADMIN ACCESS</span><h1>Welcome back.</h1><p>Manage products, articles and customer enquiries from your private workspace.</p><form id="loginForm" class="form"><div class="field"><label>Username or email</label><input name="identifier" required autocomplete="username" placeholder="admin@example.com"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password" placeholder="••••••••"></div><button class="button" type="submit">Sign in →</button><div id="loginError" class="error"></div></form><a class="login-back" href="/">← Back to website</a></section></main><script>document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(r.ok)location.href='/admin';else document.querySelector('#loginError').textContent=d.message||'Login failed'}catch{document.querySelector('#loginError').textContent='Unable to connect to the server.'}finally{b.disabled=false}});</script></body></html>
